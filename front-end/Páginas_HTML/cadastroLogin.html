   <div class="cadastro-center">
  <form class="container-cadastro" id="formLogin" novalidate>
    <div class="textos">
      <h1>Fazer login</h1>
      <p class="subtitulo">Entre para ver suas trocas de livros</p>
    </div>

    <div class="input-box">
      <input id="loginEmail" type="email" placeholder="E-mail institucional" required>
      <i class="bx bxs-envelope"></i>
    </div>

    <div class="input-box">
      <input id="loginSenha" type="password" placeholder="Senha" required>
      <i class="bx bxs-lock-alt"></i>
    </div>

    <div class="remember-forgot">
      <label>
        <input type="checkbox" id="CheckOne">
        Lembrar a senha
      </label>
      <a href="#">Esqueci a senha</a>
    </div>

    <div id="mensagem" class="mensagem"></div>

    <button type="submit" class="Cadastro">    Entrar</button>

    <p class="tem-conta">Ainda não tem conta? <a href="./cadastrousuario.html">Cadastre-se</a></p>
  </form>
</div>
    <footer class="py-4 text-center">
        <p>Sua próxima história pode estar na estante de alguém!</p>
    </footer>
