<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" 
    rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
    crossorigin="anonymous">
     <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css'
    rel='stylesheet'> 
    <script src="https://kit.fontawesome.com/YOUR_KIT_CODE.js" crossorigin="anonymous"></script>
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
    @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');

    :root{
    --sage: #B5D19A;        
    --light-sage: #8DB873;
    --moss-sage: #5F9A5A;
    --olive-sage: #3F7F47;
    --forest-sage: #1f582c; 
    --deep-sage:#1f582c;    
}

    *{
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: "Poppins", sans-serif;
    }

    body{
        min-height: 100vh;
        background-image: url("img/teladecadastrousuario.png");
        background-size: cover;
        background-position: center;
        background-color: var(--sage);
    }

    .cadastro-center{
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
    }

    /* tela de cadastro menor */
    .container-cadastro{
        width: 400px;
        max-width: 92%;
        padding: 22px 30px;
        border: 2px solid var(--forest-sage);
        border-radius: 10px;
        color: var(--forest-sage);
        box-shadow: 0 0 10px var(--olive-sage);
        background-color: #eef1e8;
    }

    .container-cadastro h1{
        font-size: 28px;
        text-align: center;
    }

    .input-box{
        position: relative;
        width: 100%;
        height: 44px;
        margin: 20px 0;
    }

    .input-box input{
        width: 100%;
        height: 100%;
        background-color: transparent;
        border: 2px solid var(--moss-sage);
        border-radius: 40px;
        outline: none;
        font-size: 15px;
        color: var(--deep-sage);
        padding: 15px 42px 15px 18px;
    }

    .input-box input:focus{
        border-color: var(--olive-sage);
        box-shadow: 0 0 6px var(--light-sage);
    }

    .input-box input::placeholder{
        color: var(--moss-sage);
    }

    .input-box i{
        position: absolute;
        right: 18px;
        font-size: 18px;
        top: 50%;
        transform: translateY(-50%);
        color: var(--olive-sage);
    }

    .remember-forgot{
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin: -8px 0 15px;
    }

    .remember-forgot label input{
        accent-color: var(--olive-sage);
        margin-right: 4px;
    }

    .remember-forgot a{
        text-decoration: none;
        color: var(--olive-sage);
    }

    .remember-forgot a:hover{
        text-decoration: underline;
    }

    .Cadastro{
        width: 100%;
        padding: 8px;
        border-radius: 10px;
        border: 2px solid var(--olive-sage);
        background-color: var(--olive-sage);
        color: #ffffff;
        font-size: 16px;
        font-weight: 600;
        box-shadow: 0 0 8px var(--forest-sage);
        transition: 0.5s;
    }

    .Cadastro:hover{
        background-color: transparent;
        border: 2px solid var(--olive-sage);
        color: var(--forest-sage);
    }

    /* navbar com letras brancas */
    .navbar{
        background-color: var(--forest-sage);
    }

    .navbar .navbar-brand,
    .navbar .nav-link,
    .navbar .nav-link.active{
        color: #ffffff;
    }

    .navbar .nav-link:hover{
        color: var(--sage);
    }

    .navbar-toggler{
        border-color: rgba(255,255,255,0.6);
    }

    .navbar-toggler-icon{
        filter: invert(1); /* ícone do menu mobile fica branco */
    }

    footer{
        background-color: var(--deep-sage);
        font-size: larger;
        color: #ffffff;
    }
    button{
        margin: 10px;
    }
</style>
   
    </style>
</head>
<body>

     <nav  id="navBar" class="navbar navbar-expand-lg ">
        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="#">
                POIEL
            </a>

            <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                data-bs-target="#navbarTogglerDemo01"
                aria-controls="navbarTogglerDemo01"
                aria-expanded="false"
                aria-label="Toggle navigation">

                <span class="navbar-toggler-icon"></span>
            </button>

            <div class="collapse navbar-collapse" id="navbarTogglerDemo01">

                <ul class="navbar-nav me-auto mb-2 mb-lg-0">

                    <li class="nav-item">
                        <a class="nav-link active" href="paginaInicial.html">Principal</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link active" href="paginasobre.html">Sobre nós</a>
                    </li>
                 </ul>

            </div>
        </div>
    </nav>

    <div class="cadastro-center">
      <form class="container-cadastro">
        <div class="textos">
            <h1>Cadastre-se agora</h1>
        </div>
        <div class="input-box">
            <input id="exampleInputName" placeholder="Digite o seu nome"  type="text">
            <i class="bx bxs-user"></i>
            <small id="NameHelp" class="form-text text-muted"></small>
          </div>
        <div class="input-box">
          <input id="exampleInputPassword" placeholder="Digite sua senha" type="password">
          <i class="bx bxs-lock-alt"></i>
          <small id="passwordHelp" class="form-text text-muted"></small>
        </div>
        <div class="remember-forgot">
            <label>
                <input type="checkbox" id="CheckOne" class="form-check-input">
                Lembrar a senha
            </label>
            <a href="#">Esqueci a senha</a>
            
          
        </div>
        
        <div id="mensagem"></div>

        <button type="submit" class="Cadastro">
            Cadastrar
        </button>
        <br>
        <button type="submit" class="Cadastro">
        <a href="./cadastroLogin.html">Fazer Login</a>
        </button>

        </form>
    </div>
    <footer class="py-4 text-center">
        <p>Sua próxima história pode estar na estante de alguém!</p>
    </footer>
 
     <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" 
    integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin
    ="anonymous"></script>
    <script src="../js/cadastro.js"></script>
</body>
</html>
