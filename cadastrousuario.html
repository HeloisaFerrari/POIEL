<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro | POIEL</title>

    <!-- ícones dos campos (boxicons) -->
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">

    <!-- seu CSS -->
    <link rel="stylesheet" href="cadastroUsuario.css">
</head>
<body>

    <nav id="navBar" class="navbar-poiel">
        <a class="marca" href="index.html">POIEL</a>
        <ul class="menu">
            <li><a href="index.html">Principal</a></li>
            <li><a href="paginadetroca.html">Minhas Trocas</a></li>
            <li><a href="cadastrousuario.html" class="ativa">Cadastro</a></li>
            <li><a href="sobrenós.html">Sobre nós</a></li>
        </ul>
    </nav>

    <div class="cadastro-center">
        <form class="container-cadastro" id="formCadastro" novalidate>
            <div class="textos">
                <h1>Cadastre-se agora</h1>
                <p class="subtitulo">Preencha seus dados para começar a trocar livros</p>
            </div>

            <div class="input-box">
                <input id="inputNome" type="text" placeholder="Nome completo" required>
                <i class="bx bxs-user"></i>
            </div>

            <div class="input-box">
                <input id="inputEmail" type="email" placeholder="E-mail institucional" required>
                <i class="bx bxs-envelope"></i>
            </div>

            <div class="input-box">
                <input id="inputMatricula" type="text" placeholder="Matrícula" required>
                <i class="bx bxs-id-card"></i>
            </div>

            <div class="linha-dupla">
                <div class="input-box">
                    <select id="selectCurso" required>
                        <option value="" disabled selected>Curso técnico</option>
                        <option>Desenvolvimento de sistemas</option>
                        <option>Energias Renováveis</option>
                    </select>
                    <i class="bx bxs-graduation"></i>
                </div>

                <div class="input-box">
                    <select id="selectModulo" required>
                        <option value="" disabled selected>Módulo</option>
                        <option>1º módulo</option>
                        <option>2º módulo</option>
                        <option>3º módulo</option>
                        <option>4º módulo</option>
                        <option>5º módulo</option>
                        <option>6º módulo</option>
                        <option>7º módulo</option>
                        <option>8º módulo</option>
                    </select>
                    <i class="bx bxs-book-bookmark"></i>
                </div>
            </div>

            <div class="input-box">
                <input id="inputSenha" type="password" placeholder="Senha" required minlength="6">
                <i class="bx bxs-lock-alt"></i>
            </div>

            <div class="input-box">
                <input id="inputConfirmaSenha" type="password" placeholder="Confirmar senha" required>
                <i class="bx bxs-lock"></i>
            </div>

            <div id="mensagem" class="mensagem"></div>

            <button type="submit" class="Cadastro">Cadastrar</button>

            <p class="tem-conta">Já tem conta? <a href="./cadastroLogin.html">Fazer login</a></p>
        </form>
    </div>

    <footer>
        <p>Sua próxima história pode estar na estante de alguém!</p>
    </footer>

    <script src="cadastrousuario.js"></script>
</body>
</html>
